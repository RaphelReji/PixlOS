<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixlOS</title>

    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>

    <!-- PixlOS Desktop -->
    <main class="desktop">

      <header class="top-bar">
        <div class="brand" id="brand">PixlOS</div>

        <div class="stystem-info">
          <span id="clock">00:00</span>
        </div>
      </header>

      <section class="desktop-content">
        <!--apps-->

        <!--start of start-->
        <div id="start-window" class="window">
          <div class="window-bar">
            <span>Welcome to PixlOS</span>

            <button id="minimize-start" class="minimize-btn">-</button>

            <button id="close-start" class="close-btn">x</button>
          </div>

        <div class="window-content">

          <div>Hello!</div>
          <div>Welcome to PixlOS.. A retro WebOS made for 90's</div>
          <hr>

          <div>> Browse the web</div>
          <div>> Play music</div>
          <div>> Take notes</div>
  
          </div>

        </div>
        <!--end of start-->



        
<div id="notes-window" class="window">
    <div class="window-bar">
        <span>Notes</span>

           <button id="minimize-notes" class="minimize-btn">-</button>

            <button id="close-notes" class="close-btn">x</button>
    </div>

    <div class="window-content">

     <div class="notes-app">

  <header class="notes-header">
    <h1>Diary</h1>

  </header>

  <main class="notes-content">

      <input
          type="text"
          id="note-title"
          placeholder="Note title...">
          <hr>

      <textarea
        id="note-text"
        placeholder="Start writing...">
      </textarea>


   </main>

   </div>

  </div>

</div>



   <!--start of browser-->
        <div id="browser-window" class="window">
          <div class="window-bar">
            <span>Browser</span>

            <button id="minimize-start" class="minimize-btn">-</button>

            <button id="close-start" class="close-btn">x</button>
          </div>

        <div class="window-content">

         <iframe src="https://www.google.com/" id="browser-frame"></iframe>
  
          </div>

        </div>
        <!--end of browser-->




           <!--start of settings-->
        <div id="browser-window" class="window">
          <div class="window-bar">
            <span>Settings</span>

            <button id="minimize-start" class="minimize-btn">-</button>

            <button id="close-start" class="close-btn">x</button>
          </div>

        <div class="window-content">

         <div id="settings-grid">

          <div id="settings-select">
            <div class="settings-btn" id="appearance-btn">Appearance</div>
            <div class="settings-btn">Wallpaper</div>
            <div class="settings-btn">Sound</div>
            <div class="settings-btn">System</div>
            <div class="settings-btn">About</div>
          </div>

          <div><!--start of 2 div settings -->
         
            <div id="appearance-window">
            
              <div class="appear-h1">Change Theme</div>
             
              <div id="theme-btns">
              <button id="day-theme-btn">DAY</button>
               <button id="night-theme-btn">NIGHT</button>
               </div>

              <hr>

               <div class="appear-h1">Accent colours</div>
                
               <div id="accent-btns">
               <div id="wood-theme" class="accent-square"></div>
               <div id="red-theme" class="accent-square"></div>
               <div id="hacker-theme" class="accent-square"></div>
               </div>



            </div>


          </div><!--end of 2 div settings-->


         </div><!--end of settings grid-->
  
          </div><!--end of window content-->

        </div>
        <!--end of settings-->



      </section>



      <!-- Dock -->
      <div class="dock">

        <button id="start-btn">Start</button>
        
    <img class="dock-app" id="open-not" title="wildnotes" src="assets/icons/world-2.png">

    <img class="dock-app" id="open-notes" title="wildmusic" src="assets/icons/notepad.png">

        <img class="dock-app" id="open-no" title="wildnotes" src="assets/icons/music.png">

    <img class="dock-app" id="open-music" title="wildmusic" src="assets/icons/image_editor.png">


        <img class="dock-app" id="open-no" title="wildnotes" src="assets/icons/files.png">

    <img class="dock-app" id="open-music" title="wildmusic" src="assets/icons/settings.png">

      </div>


    </main>

    <script src="js/script.js"></script>
  </body>
</html>

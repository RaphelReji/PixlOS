<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixlOS</title>

    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>

    <!-- PixlOS Desktop -->
    <main class="desktop">

      <header class="top-bar">
        <div class="brand" id="brand">PixlOS</div>

        <div class="stystem-info">
          <span id="clock">00:00</span>
        </div>
      </header>

      <section class="desktop-content">
        <!--apps-->

        <!--start of gallery-->
        <div id="start-window" class="window">
          <div class="window-bar">
            <span>Welcome to PixlOS</span>

            <img src="assets/icons_2/full-screen.png" id="fullscreen-gallery" class="full-btn" />

           <img src="assets/icons_2/minimize.png" id="minimize-gallery" class="minimize-btn"/>

            <img src="assets/icons_2/close.png" id="close-gallery" class="close-btn"/>
          </div>

        <div class="window-content">

          <div>Hello!</div>
          <div>Welcome to PixlOS.. A retro WebOS made for 90's</div>
          <hr>
  
          </div>

        </div>
        <!--end of gallery-->

      </section>

      <!-- Dock -->
      <div class="dock">

        <button id="start-btn">Start</button>
        
    <img class="dock-app" id="open-notes" title="wildnotes" src="assets/icons/settings_icon.png">

    <img class="dock-app" id="open-music" title="wildmusic" src="assets/icons/settings_icon.png">
      </div>


    </main>

    <script src="js/script.js"></script>
  </body>
</html>
